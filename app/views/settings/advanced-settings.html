<md-subheader class="md-no-sticky"><md-icon>settings</md-icon> {{'pages.settings.advanced.title' | i18next}}</md-subheader>
<md-list-item>
    <p>{{'pages.settings.advanced.customPathOfFile' | i18next}}</p>

    <md-switch class="md-primary" ng-model="$root.settings.customTranslationsPathEnabled" ng-change="$ctrl.toggleCustomTranslationsPathStatus($root.settings.customTranslationsPathEnabled)">
</md-list-item>

<md-list-item>
  <md-input-container class="md-block" flex-gt-xs>
    <label>{{'pages.settings.advanced.folderPath' | i18next}}</label>
    <input ng-model="$root.settings.customTranslationsPath" ng-blur="$ctrl.saveCustomTranslationsPath()" placeholder="{{'pages.settings.advanced.folderPath' | i18next}}" ng-disabled="!$root.settings.customTranslationsPathEnabled">
  </md-input-container>
</md-list-item>
