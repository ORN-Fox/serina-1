<h2 mat-dialog-title>{{titleKey | translate}}</h2>
<mat-dialog-content>
    <mat-form-field class="w-100">
        <mat-label>{{placeholderKey | translate}}</mat-label>
        <input matInput [(ngModel)]="data.groupName" (ngModelChange)="formatGroupName(data.groupName)">
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="cancel()">{{"commons.actions.cancel" | translate}}</button>
    <button mat-button color="primary" [mat-dialog-close]="data.groupName" cdkFocusInitial>{{confirmButtonKey | translate}}</button>
</mat-dialog-actions>
